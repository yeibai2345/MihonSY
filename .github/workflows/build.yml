name: Build MihonSY APK

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: "ci = test APK; unsigned = release for local signing; formal = signed GitHub release"
        type: choice
        options: [ci, unsigned, formal]
        default: ci
  workflow_call:
    inputs:
      mode:
        type: string
        default: ci

concurrency:
  group: mihonsy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve build mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          MODE="${REQUESTED_MODE:-ci}"
          if [ -z "$REQUESTED_MODE" ] && git log -1 --format=%s | grep -qiE '\[release\]|正式版'; then
            MODE=formal
          fi
          echo "value=$MODE" >> "$GITHUB_OUTPUT"
      - name: Prepare release signing
        if: steps.mode.outputs.value == 'formal'
        env:
          KEYSTORE_BASE64: ${{ secrets.MIHONSY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MIHONSY_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Configure MIHONSY_KEYSTORE_BASE64 before releasing."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Configure MIHONSY_KEYSTORE_PASSWORD before releasing."; exit 1; }
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/mihonmod.jks
          test -s keystore/mihonmod.jks
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Run regression tests
        run: |
          c++ -std=c++17 -O2 -I app/src/main/cpp app/src/test/cpp/upscale_pixels_test.cpp -o /tmp/upscale-pixels-test
          /tmp/upscale-pixels-test
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :domain:test --no-daemon --stacktrace
      - name: Build test APK
        if: steps.mode.outputs.value == 'ci'
        run: ./gradlew :app:assembleDebug -PmihonsyAbi=arm64-v8a --no-daemon --stacktrace
      - name: Build unsigned release for local signing
        if: steps.mode.outputs.value == 'unsigned'
        run: ./gradlew :app:assembleRelease -Pdisable-code-shrink -PmihonsyUnsigned=true -PmihonsyAbi=arm64-v8a -PmihonsyUniversal=true --no-daemon --stacktrace
      - name: Build signed release APK
        if: steps.mode.outputs.value == 'formal'
        env:
          MIHONSY_STORE_PASSWORD: ${{ secrets.MIHONSY_KEYSTORE_PASSWORD }}
          MIHONSY_KEY_PASSWORD: ${{ secrets.MIHONSY_KEY_PASSWORD || secrets.MIHONSY_KEYSTORE_PASSWORD }}
          MIHONSY_KEY_ALIAS: ${{ secrets.MIHONSY_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease -Pdisable-code-shrink -PmihonsyAbi=arm64-v8a -PmihonsyUniversal=true --no-daemon --stacktrace
      - name: Prepare verified release assets
        if: steps.mode.outputs.value == 'formal'
        id: release
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists. Bump versionName before publishing."
            exit 1
          fi
          mkdir -p release-assets
          for APK in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
            ABI=$(basename "$APK" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            cp "$APK" "release-assets/mihonsy-$VERSION-$ABI.apk"
          done
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
          python3 .github/scripts/release_notes.py "$VERSION" > release-assets/RELEASE_NOTES.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mihonsy-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            release-assets/*
          retention-days: 30
          if-no-files-found: error
      - name: Publish GitHub release
        if: steps.mode.outputs.value == 'formal'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MihonSY $RELEASE_VERSION" --latest \
            --notes-file release-assets/RELEASE_NOTES.md \
            release-assets/*.apk release-assets/SHA256SUMS.txt
